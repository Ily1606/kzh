services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dsh
      DB_USERNAME: dsh
      DB_PASSWORD: secret
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      - postgres
      - redis
      - mailpit

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dsh
      POSTGRES_USER: dsh
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsh -d dsh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
