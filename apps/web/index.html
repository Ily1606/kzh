<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DSH is the registry for DeepSeek Harness plugins. Discover community packages, publish your own and install them with a single npx command."
    />
    <title>DSH — DeepSeek Harness plugin registry</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Runs before Vue so the first paint already has the right theme; without
      // it the page flashes white on every load for a visitor using dark.
      // Mirrors the storage key and the "auto" | "dark" | "light" values that
      // useDark writes (see useTheme.ts).
      (function () {
        try {
          var mode = localStorage.getItem("dsh-theme") || "auto";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode: fall back to whatever CSS resolves to */
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
